name: Test Structured Outputs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  test-basic-types:
    name: Test Basic Type Conversions
    runs-on: ubuntu-latest
    environment: &claude_ci_environment
      name: >-
        ${{ github.event_name != 'pull_request_target' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft != true &&
        (((github.event_name == 'pull_request' || github.event_name == 'workflow_call') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          github.ref == 'refs/heads/main' &&
          (github.event.pull_request.head.repo.full_name == '' ||
           github.event.pull_request.head.repo.full_name == github.repository))) &&
        'security-ci-claude' || 'security-ci-untrusted' }}
    steps:
      - &require_claude_ci
        name: Require Claude CI authentication
        env:
          CLAUDE_CI_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CI_TOKEN" ]; then
            echo "::error::Claude CI authentication is unavailable for this context."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Test with explicit values
        id: test
        uses: ./base-action
        with:
          prompt: |
            Run this command: echo "test"

            Then return EXACTLY these values:
            - text_field: "hello"
            - number_field: 42
            - boolean_true: true
            - boolean_false: false
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash
            --json-schema '{"type":"object","properties":{"text_field":{"type":"string"},"number_field":{"type":"number"},"boolean_true":{"type":"boolean"},"boolean_false":{"type":"boolean"}},"required":["text_field","number_field","boolean_true","boolean_false"]}'

      - name: Verify outputs
        env:
          ACTION_STRUCTURED_OUTPUT: ${{ steps.test.outputs.structured_output }}
        run: |
          # Parse the structured_output JSON
          OUTPUT="$ACTION_STRUCTURED_OUTPUT"

          # Test string pass-through
          TEXT_FIELD=$(printf '%s' "$OUTPUT" | jq -r '.text_field' 2>/dev/null)
          if [ "$TEXT_FIELD" != "hello" ]; then
            echo "❌ String field must equal 'hello'."
            exit 1
          fi

          # Test number → string conversion
          NUMBER_FIELD=$(printf '%s' "$OUTPUT" | jq -r '.number_field' 2>/dev/null)
          if [ "$NUMBER_FIELD" != "42" ]; then
            echo "❌ Number field must equal 42."
            exit 1
          fi

          # Test boolean → "true" conversion
          BOOLEAN_TRUE=$(printf '%s' "$OUTPUT" | jq -r '.boolean_true' 2>/dev/null)
          if [ "$BOOLEAN_TRUE" != "true" ]; then
            echo "❌ Boolean true field must be true."
            exit 1
          fi

          # Test boolean → "false" conversion
          BOOLEAN_FALSE=$(printf '%s' "$OUTPUT" | jq -r '.boolean_false' 2>/dev/null)
          if [ "$BOOLEAN_FALSE" != "false" ]; then
            echo "❌ Boolean false field must be false."
            exit 1
          fi

          echo "✅ All basic type conversions correct"

  test-complex-types:
    name: Test Arrays and Objects
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Test complex types
        id: test
        uses: ./base-action
        with:
          prompt: |
            Run: echo "ready"

            Return EXACTLY:
            - items: ["apple", "banana", "cherry"]
            - config: {"key": "value", "count": 3}
            - empty_array: []
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash
            --json-schema '{"type":"object","properties":{"items":{"type":"array","items":{"type":"string"}},"config":{"type":"object"},"empty_array":{"type":"array"}},"required":["items","config","empty_array"]}'

      - name: Verify JSON stringification
        env:
          ACTION_STRUCTURED_OUTPUT: ${{ steps.test.outputs.structured_output }}
        run: |
          # Parse the structured_output JSON
          OUTPUT="$ACTION_STRUCTURED_OUTPUT"

          # Arrays should be JSON stringified
          if ! printf '%s' "$OUTPUT" | jq -e '.items | length == 3' > /dev/null 2>&1; then
            echo "❌ Array not properly formatted"
            echo "Structured output did not match the required shape."
            exit 1
          fi

          # Objects should be JSON stringified
          if ! printf '%s' "$OUTPUT" | jq -e '.config.key == "value"' > /dev/null 2>&1; then
            echo "❌ Object not properly formatted"
            echo "Structured output did not match the required shape."
            exit 1
          fi

          # Empty arrays should work
          if ! printf '%s' "$OUTPUT" | jq -e '.empty_array | length == 0' > /dev/null 2>&1; then
            echo "❌ Empty array not properly formatted"
            echo "Structured output did not match the required shape."
            exit 1
          fi

          echo "✅ All complex types handled correctly"

  test-edge-cases:
    name: Test Edge Cases
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Test edge cases
        id: test
        uses: ./base-action
        with:
          prompt: |
            Run: echo "test"

            Return EXACTLY:
            - zero: 0
            - empty_string: ""
            - negative: -5
            - decimal: 3.14
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash
            --json-schema '{"type":"object","properties":{"zero":{"type":"number"},"empty_string":{"type":"string"},"negative":{"type":"number"},"decimal":{"type":"number"}},"required":["zero","empty_string","negative","decimal"]}'

      - name: Verify edge cases
        env:
          ACTION_STRUCTURED_OUTPUT: ${{ steps.test.outputs.structured_output }}
        run: |
          # Parse the structured_output JSON
          OUTPUT="$ACTION_STRUCTURED_OUTPUT"

          # Zero should be "0", not empty or falsy
          ZERO=$(printf '%s' "$OUTPUT" | jq -r '.zero' 2>/dev/null)
          if [ "$ZERO" != "0" ]; then
            echo "❌ Zero field must equal 0."
            exit 1
          fi

          # Empty string should be empty (not "null" or missing)
          EMPTY_STRING=$(printf '%s' "$OUTPUT" | jq -r '.empty_string' 2>/dev/null)
          if [ "$EMPTY_STRING" != "" ]; then
            echo "❌ Empty string field must be empty."
            exit 1
          fi

          # Negative numbers should work
          NEGATIVE=$(printf '%s' "$OUTPUT" | jq -r '.negative' 2>/dev/null)
          if [ "$NEGATIVE" != "-5" ]; then
            echo "❌ Negative field must equal -5."
            exit 1
          fi

          # Decimals should preserve precision
          DECIMAL=$(printf '%s' "$OUTPUT" | jq -r '.decimal' 2>/dev/null)
          if [ "$DECIMAL" != "3.14" ]; then
            echo "❌ Decimal field must equal 3.14."
            exit 1
          fi

          echo "✅ All edge cases handled correctly"

  test-name-sanitization:
    name: Test Output Name Sanitization
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Test special characters in field names
        id: test
        uses: ./base-action
        with:
          prompt: |
            Run: echo "test"
            Return EXACTLY: {test-result: "passed", item_count: 10}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash
            --json-schema '{"type":"object","properties":{"test-result":{"type":"string"},"item_count":{"type":"number"}},"required":["test-result","item_count"]}'

      - name: Verify sanitized names work
        env:
          ACTION_STRUCTURED_OUTPUT: ${{ steps.test.outputs.structured_output }}
        run: |
          # Parse the structured_output JSON
          OUTPUT="$ACTION_STRUCTURED_OUTPUT"

          # Hyphens should be preserved in the JSON
          TEST_RESULT=$(printf '%s' "$OUTPUT" | jq -r '.["test-result"]' 2>/dev/null)
          if [ "$TEST_RESULT" != "passed" ]; then
            echo "❌ Hyphenated field must equal passed."
            exit 1
          fi

          # Underscores should work
          ITEM_COUNT=$(printf '%s' "$OUTPUT" | jq -r '.item_count' 2>/dev/null)
          if [ "$ITEM_COUNT" != "10" ]; then
            echo "❌ Underscore field must equal 10."
            exit 1
          fi

          echo "✅ Name sanitization works"

  test-execution-file-structure:
    name: Test Execution File Format
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Run with structured output
        id: test
        uses: ./base-action
        with:
          prompt: "Run: echo 'complete'. Return: {done: true}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash
            --json-schema '{"type":"object","properties":{"done":{"type":"boolean"}},"required":["done"]}'

      - name: Verify execution file contains structured_output
        env:
          ACTION_EXECUTION_FILE: ${{ steps.test.outputs.execution_file }}
        run: |
          FILE="$ACTION_EXECUTION_FILE"

          # Check file exists
          if [ ! -f "$FILE" ]; then
            echo "❌ Execution file missing"
            exit 1
          fi

          # Check for structured_output field
          if ! jq -e '.[] | select(.type == "result") | .structured_output' "$FILE" > /dev/null 2>&1; then
            echo "❌ No structured_output in execution file"
            echo "Execution data withheld; test assertions report the result."
            exit 1
          fi

          # Verify the actual value
          DONE=$(jq -r '.[] | select(.type == "result") | .structured_output.done' "$FILE" 2>/dev/null)
          if [ "$DONE" != "true" ]; then
            echo "❌ Wrong value in execution file"
            exit 1
          fi

          echo "✅ Execution file format correct"

  test-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
      - test-basic-types
      - test-complex-types
      - test-edge-cases
      - test-name-sanitization
      - test-execution-file-structure
    if: always()
    steps:
      - name: Generate Summary
        run: |
          {
            echo "# Structured Output Tests (Optimized)"
            echo ""
            echo "Fast, deterministic tests using explicit prompts"
            echo ""
            echo "| Test | Result |"
            echo "|------|--------|"
            echo "| Basic Types | ${{ needs.test-basic-types.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Complex Types | ${{ needs.test-complex-types.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Edge Cases | ${{ needs.test-edge-cases.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Name Sanitization | ${{ needs.test-name-sanitization.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Execution File | ${{ needs.test-execution-file-structure.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"

            # Check if all passed
            ALL_PASSED=${{
              needs.test-basic-types.result == 'success' &&
              needs.test-complex-types.result == 'success' &&
              needs.test-edge-cases.result == 'success' &&
              needs.test-name-sanitization.result == 'success' &&
              needs.test-execution-file-structure.result == 'success'
            }}

            if [ "$ALL_PASSED" = "true" ]; then
              echo ""
              echo "## ✅ All Tests Passed"
            else
              echo ""
              echo "## ❌ Some Tests Failed"
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
