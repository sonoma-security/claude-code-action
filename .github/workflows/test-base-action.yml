name: Test Claude Code Action

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      test_prompt:
        description: "Test prompt for Claude"
        required: false
        default: "List the files in the current directory starting with 'package'"
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  test-inline-prompt:
    runs-on: ubuntu-latest
    environment: &claude_ci_environment
      name: >-
        ${{ github.event_name != 'pull_request_target' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft != true &&
        (((github.event_name == 'pull_request' || github.event_name == 'workflow_call') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          github.ref == 'refs/heads/main' &&
          (github.event.pull_request.head.repo.full_name == '' ||
           github.event.pull_request.head.repo.full_name == github.repository))) &&
        'security-ci-claude' || 'security-ci-untrusted' }}
    steps:
      - &require_claude_ci
        name: Require Claude CI authentication
        env:
          CLAUDE_CI_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CI_TOKEN" ]; then
            echo "::error::Claude CI authentication is unavailable for this context."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Test with inline prompt
        id: inline-test
        uses: ./base-action
        with:
          prompt: ${{ github.event.inputs.test_prompt || 'List the files in the current directory starting with "package"' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Glob,Read"'

      - name: Verify inline prompt output
        env:
          ACTION_EXECUTION_FILE: ${{ steps.inline-test.outputs.execution_file }}
          ACTION_CONCLUSION: ${{ steps.inline-test.outputs.conclusion }}
        run: |
          OUTPUT_FILE="$ACTION_EXECUTION_FILE"
          CONCLUSION="$ACTION_CONCLUSION"

          echo "Checking action result metadata."

          if [ "$CONCLUSION" = "success" ]; then
            echo "✅ Action completed successfully"
          else
            echo "❌ Action failed"
            exit 1
          fi

          if [ -f "$OUTPUT_FILE" ]; then
            if [ -s "$OUTPUT_FILE" ]; then
              echo "✅ Execution log file created successfully with content"
              echo "Validating JSON format:"
              if jq . "$OUTPUT_FILE" > /dev/null 2>&1; then
                echo "✅ Output is valid JSON"
                echo "Execution JSON is checked without printing its contents."
                echo "Execution data withheld; test assertions report the result."
              else
                echo "❌ Output is not valid JSON"
                exit 1
              fi
            else
              echo "❌ Execution log file is empty"
              exit 1
            fi
          else
            echo "❌ Execution log file not found"
            exit 1
          fi

  test-prompt-file:
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Create test prompt file
        run: |
          cat > test-prompt.txt << EOF
          ${PROMPT}
          EOF
        env:
          PROMPT: ${{ github.event.inputs.test_prompt || 'List the files in the current directory starting with "package"' }}

      - name: Test with prompt file and allowed tools
        id: prompt-file-test
        uses: ./base-action
        with:
          prompt_file: "test-prompt.txt"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Glob,Read"'

      - name: Verify prompt file output
        env:
          ACTION_EXECUTION_FILE: ${{ steps.prompt-file-test.outputs.execution_file }}
          ACTION_CONCLUSION: ${{ steps.prompt-file-test.outputs.conclusion }}
        run: |
          OUTPUT_FILE="$ACTION_EXECUTION_FILE"
          CONCLUSION="$ACTION_CONCLUSION"

          echo "Checking action result metadata."

          if [ "$CONCLUSION" = "success" ]; then
            echo "✅ Action completed successfully"
          else
            echo "❌ Action failed"
            exit 1
          fi

          if [ -f "$OUTPUT_FILE" ]; then
            if [ -s "$OUTPUT_FILE" ]; then
              echo "✅ Execution log file created successfully with content"
              echo "Validating JSON format:"
              if jq . "$OUTPUT_FILE" > /dev/null 2>&1; then
                echo "✅ Output is valid JSON"
                echo "Execution JSON is checked without printing its contents."
                echo "Execution data withheld; test assertions report the result."
              else
                echo "❌ Output is not valid JSON"
                exit 1
              fi
            else
              echo "❌ Execution log file is empty"
              exit 1
            fi
          else
            echo "❌ Execution log file not found"
            exit 1
          fi
