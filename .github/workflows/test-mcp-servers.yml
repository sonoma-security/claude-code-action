name: Test MCP Servers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  test-mcp-integration:
    runs-on: ubuntu-latest
    environment: &claude_ci_environment
      name: >-
        ${{ github.event_name != 'pull_request_target' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft != true &&
        (((github.event_name == 'pull_request' || github.event_name == 'workflow_call') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          github.ref == 'refs/heads/main' &&
          (github.event.pull_request.head.repo.full_name == '' ||
           github.event.pull_request.head.repo.full_name == github.repository))) &&
        'security-ci-claude' || 'security-ci-untrusted' }}
    steps:
      - &require_claude_ci
        name: Require Claude CI authentication
        env:
          CLAUDE_CI_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CI_TOKEN" ]; then
            echo "::error::Claude CI authentication is unavailable for this context."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd base-action/test/mcp-test
          bun install --frozen-lockfile

      - name: Run Claude Code with MCP test
        uses: ./base-action
        id: claude-test
        with:
          prompt: "List all available tools"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        env:
          # Change to test directory so it finds .mcp.json
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/base-action/test/mcp-test

      - name: Check MCP server output
        run: |
          echo "Checking Claude output for MCP servers..."

          # Parse the JSON output
          OUTPUT_FILE="${RUNNER_TEMP}/claude-execution-output.json"

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "Error: Output file not found!"
            exit 1
          fi

          echo "Execution JSON is checked without printing its contents."
          echo "Execution data withheld; test assertions report the result."

          # Check if mcp_servers field exists in the init event
          if jq -e '.[] | select(.type == "system" and .subtype == "init") | .mcp_servers' "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "✓ Found mcp_servers in output"
            
            # Check if test-server is connected
            if jq -e '.[] | select(.type == "system" and .subtype == "init") | .mcp_servers[] | select(.name == "test-server" and .status == "connected")' "$OUTPUT_FILE" > /dev/null 2>&1; then
              echo "✓ test-server is connected"
            else
              echo "✗ test-server not found or not connected"
              echo "MCP metadata did not match the required shape."
              exit 1
            fi
            
            # Check if mcp tools are available
            if jq -e '.[] | select(.type == "system" and .subtype == "init") | .tools[] | select(. == "mcp__test-server__test_tool")' "$OUTPUT_FILE" > /dev/null 2>&1; then
              echo "✓ MCP test tool found"
            else
              echo "✗ MCP test tool not found"
              echo "MCP metadata did not match the required shape."
              exit 1
            fi
          else
            echo "✗ No mcp_servers field found in init event"
            echo "MCP metadata did not match the required shape."
            exit 1
          fi

          echo "✓ All MCP server checks passed!"

  test-mcp-config-flag:
    runs-on: ubuntu-latest
    environment: *claude_ci_environment
    steps:
      - *require_claude_ci

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd base-action/test/mcp-test
          bun install --frozen-lockfile

      - name: Debug environment paths (--mcp-config test)
        run: |
          echo "=== Environment Variables (--mcp-config test) ==="
          echo "HOME: $HOME"
          echo ""
          echo "=== Expected Config Paths ==="
          echo "GitHub action writes to: $HOME/.claude/settings.json"
          echo "Claude should read from: $HOME/.claude/settings.json"
          echo ""
          echo "=== Actual File System ==="
          ls -la "$HOME/.claude/" || echo "No $HOME/.claude directory"

      - name: Run Claude Code with --mcp-config flag
        uses: ./base-action
        id: claude-config-test
        with:
          prompt: "List all available tools"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --mcp-config '{"mcpServers":{"test-server":{"type":"stdio","command":"bun","args":["simple-mcp-server.ts"],"env":{}}}}'
        env:
          # Change to test directory so bun can find the MCP server script
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/base-action/test/mcp-test

      - name: Check MCP server output with --mcp-config
        run: |
          echo "Checking Claude output for MCP servers with --mcp-config flag..."

          # Parse the JSON output
          OUTPUT_FILE="${RUNNER_TEMP}/claude-execution-output.json"

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "Error: Output file not found!"
            exit 1
          fi

          echo "Execution JSON is checked without printing its contents."
          echo "Execution data withheld; test assertions report the result."

          # Check if mcp_servers field exists in the init event
          if jq -e '.[] | select(.type == "system" and .subtype == "init") | .mcp_servers' "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "✓ Found mcp_servers in output"
            
            # Check if test-server is connected
            if jq -e '.[] | select(.type == "system" and .subtype == "init") | .mcp_servers[] | select(.name == "test-server" and .status == "connected")' "$OUTPUT_FILE" > /dev/null 2>&1; then
              echo "✓ test-server is connected"
            else
              echo "✗ test-server not found or not connected"
              echo "MCP metadata did not match the required shape."
              exit 1
            fi
            
            # Check if mcp tools are available
            if jq -e '.[] | select(.type == "system" and .subtype == "init") | .tools[] | select(. == "mcp__test-server__test_tool")' "$OUTPUT_FILE" > /dev/null 2>&1; then
              echo "✓ MCP test tool found"
            else
              echo "✗ MCP test tool not found"
              echo "MCP metadata did not match the required shape."
              exit 1
            fi
          else
            echo "✗ No mcp_servers field found in init event"
            echo "MCP metadata did not match the required shape."
            exit 1
          fi

          echo "✓ All MCP server checks passed with --mcp-config flag!"
